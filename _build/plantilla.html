<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
{{CSS}}
</style>
</head>
<body>
<div class="wrap">
<div class="autor">
  <span><b>Eduardo H. Ramirez, PhD</b></span>
  <nav aria-label="{{t:social}}">
    <a href="https://www.linkedin.com/in/ehramirez" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://x.com/eduhrami" target="_blank" rel="noopener">X</a>
    <a href="https://github.com/eduhrami" target="_blank" rel="noopener">GitHub</a>
  </nav>
</div>
  <div class="topnav">
    <div class="links">
      <a class="navbtn" href="../index.html">{{t:index}}</a>
      <a class="navbtn" id="navPrev" href="#">{{t:prevPattern}}</a>
      <a class="navbtn" id="navNext" href="#">{{t:nextPattern}}</a>
    </div>
    <div class="links">
      <span class="kbd" id="hCount"></span>
      <a class="navbtn" href="{{OTHER_URL}}" hreflang="{{OTHER_LANG}}" lang="{{OTHER_LANG}}">{{OTHER_LABEL}}</a>
      <button class="navbtn" id="themeBtn" type="button">{{t:theme}}</button>
    </div>
  </div>
  <header>
    <h1 id="hTitle"></h1>
    <p class="sub" id="hSub"></p>
  </header>
  <div class="intro" id="intro"></div>
  <div class="legend" id="legend"></div>

  <div class="stage-scroll"><div class="stage" id="stage"></div></div>

  <div class="controls">
    <button class="btn" id="btnReset" type="button">{{t:reset}}</button>
    <button class="btn" id="btnPrev" type="button">{{t:prev}}</button>
    <button class="btn primary" id="btnPlay" type="button">{{t:play}}</button>
    <button class="btn" id="btnNext" type="button">{{t:next}}</button>
    <button class="btn" id="btnReplay" type="button">{{t:replay}}</button>
    <select class="btn" id="speed" aria-label="{{t:speed}}">
      <option value="0.6">{{t:slow}}</option>
      <option value="1" selected>{{t:normal}}</option>
      <option value="1.7">{{t:fast}}</option>
    </select>
    <span class="kbd">{{t:keys}}</span>
    <span class="counter" id="counter"></span>
  </div>
  <div class="timeline" id="timeline"></div>

  <div class="panels">
    <section class="panel">
      <span class="step-lbl" id="stepLbl"></span>
      <h2 class="step-title" id="stepTitle"></h2>
      <div class="step-text" id="stepText"></div>
      <div id="flowList"></div>
      <div id="ctxWrap"></div>
      <div id="outWrap"></div>
    </section>
    <section class="panel">
      <div class="ptabs">
        <button class="ptab active" data-view="board" id="boardTab" type="button">{{t:sharedState}}</button>
        <button class="ptab" data-view="trace" type="button">Trace</button>
      </div>
      <div class="pview active" id="view-board"><div id="board"></div></div>
      <div class="pview" id="view-trace">
        <label class="trace-opts"><input type="checkbox" id="fullTrace"> {{t:fullTrace}}</label>
        <pre class="trace" id="traceBox"></pre>
      </div>
    </section>
  </div>

  <details class="panel fw" id="frameworks" hidden></details>
  <section class="panel reading" id="reading"></section>
</div>
<script>
window.UI = {{UI}};
window.META = {{META}};
</script>
<script>
{{DATA}}
</script>
<script>
{{PROMPTS}}
</script>
<script>
{{FRAMEWORKS}}
</script>
<script>
{{JS}}
</script>
</body>
</html>
